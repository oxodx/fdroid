name: Publish F-Droid repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
      FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
      FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
      FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Set up Python
        uses: https://data.forgejo.org/actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install F-Droid repository tools
        run: pip install --disable-pip-version-check fdroidserver==2.4.5

      - name: Allow repository at domain root
        run: |
          python - <<'PY'
          from pathlib import Path
          import fdroidserver.common

          source_path = Path(fdroidserver.common.__file__)
          source = source_path.read_text()
          original = "if not config['repo_url'].endswith('/repo'):"
          replacement = "if not config['repo_url'].endswith('/repo') and urlparse(config['repo_url']).path not in ('', '/'):"
          if source.count(original) != 1:
              raise SystemExit('F-Droid URL validation changed; review root URL support')
          source_path.write_text(source.replace(original, replacement))
          PY

      - name: Configure signing
        run: |
          test -n "$FDROID_KEYSTORE_BASE64"
          test -n "$FDROID_KEYSTORE_PASSWORD"
          test -n "$FDROID_KEY_ALIAS"
          test -n "$FDROID_KEY_PASSWORD"
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 --decode > fdroid-repo.keystore
          chmod 600 config.yml
          chmod 600 fdroid-repo.keystore

      - name: Read Magister release metadata
        id: magister
        run: |
          release=releases/nl.oxod.magister.json
          echo "url=$(jq -er '.url' "$release")" >> "$FORGEJO_OUTPUT"
          echo "repository=$(jq -er '.repository' "$release")" >> "$FORGEJO_OUTPUT"
          echo "tag=$(jq -er '.tag' "$release")" >> "$FORGEJO_OUTPUT"
          echo "asset=$(jq -er '.asset' "$release")" >> "$FORGEJO_OUTPUT"

      - name: Download Magister release
        uses: https://data.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: download
          url: ${{ steps.magister.outputs.url }}
          repo: ${{ steps.magister.outputs.repository }}
          tag: ${{ steps.magister.outputs.tag }}
          release-dir: repo
          token: ${{ forgejo.token }}

      - name: Verify release asset
        run: test -f "repo/${{ steps.magister.outputs.asset }}"

      - name: Build repository index
        run: fdroid update --pretty

      - name: Create public repository
        run: |
          mkdir -p _site
          cp -a repo/. _site/
          mkdir -p _site/fdroid/repo _site/repo
          cp -a repo/. _site/fdroid/repo/
          cp -a repo/. _site/repo/

      - name: Upload repository artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: fdroid-repository
          path: _site

      - name: Publish repository
        uses: https://data.forgejo.org/actions/git-pages@v2
        with:
          site: https://pages.oxod.nl/fdroid/
          server: pages.oxod.nl
          token: ${{ forgejo.token }}
          source: _site/
          strict: true
          comment: ${{ forgejo.sha }}
