name: Publish F-Droid repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
      FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
      FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
      FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install F-Droid repository tools
        run: pip install --disable-pip-version-check fdroidserver==2.4.5

      - name: Allow repository at domain root
        run: |
          python - <<'PY'
          from pathlib import Path
          import fdroidserver.common

          source_path = Path(fdroidserver.common.__file__)
          source = source_path.read_text()
          original = "if not config['repo_url'].endswith('/repo'):"
          replacement = "if not config['repo_url'].endswith('/repo') and urlparse(config['repo_url']).path not in ('', '/'):"
          if source.count(original) != 1:
              raise SystemExit('F-Droid URL validation changed; review root URL support')
          source_path.write_text(source.replace(original, replacement))
          PY

      - name: Configure signing
        run: |
          test -n "$FDROID_KEYSTORE_BASE64"
          test -n "$FDROID_KEYSTORE_PASSWORD"
          test -n "$FDROID_KEY_ALIAS"
          test -n "$FDROID_KEY_PASSWORD"
          printf '%s' "$FDROID_KEYSTORE_BASE64" | base64 --decode > fdroid-repo.keystore
          chmod 600 config.yml
          chmod 600 fdroid-repo.keystore

      - name: Download app releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p repo
          for release in releases/*.json; do
            repository=$(jq -er '.repository' "$release")
            tag=$(jq -er '.tag' "$release")
            asset=$(jq -er '.asset' "$release")
            gh release download "$tag" --repo "$repository" --pattern "$asset" --dir repo
          done

      - name: Build repository index
        run: |
          mkdir -p repo
          fdroid update --pretty

      - name: Create public Pages artifact
        run: |
          mkdir -p _site
          cp -a repo/. _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
